<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Relevansi: BM25 vs TF-IDF</title>
    <!-- Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js untuk visualisasi grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        /* Styling khusus untuk memastikan container chart stabil */
        .chart-container {
            position: relative;
            height: 350px; /* Tinggi dikunci */
            width: 100%;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white">
            <h1 class="text-2xl font-bold">Kalkulator Relevansi Dokumen</h1>
            <p class="opacity-90 mt-1">Simulasi Perbandingan BM25 dan TF-IDF Cosine Similarity</p>
        </div>

        <div class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Column: Inputs (1/3 width on large screens) -->
            <div class="lg:col-span-1 space-y-6">
                
                <!-- Query Input -->
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                    <label class="block text-sm font-semibold text-blue-800 mb-2">Query (Kata Kunci)</label>
                    <input type="text" id="queryInput" value="kucing makan ikan" 
                           class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                           placeholder="Masukkan query pencarian...">
                </div>

                <!-- Parameters BM25 -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <h3 class="text-sm font-bold text-gray-700 mb-3 border-b pb-2">Parameter BM25</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">k1 (Saturasi Term)</label>
                            <input type="number" id="k1Input" step="0.1" value="1.2" 
                                   class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
                            <input type="range" min="0" max="3" step="0.1" value="1.2" class="w-full mt-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" 
                                   oninput="document.getElementById('k1Input').value = this.value">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">b (Normalisasi Panjang)</label>
                            <input type="number" id="bInput" step="0.1" value="0.75" min="0" max="1" 
                                   class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
                            <input type="range" min="0" max="1" step="0.05" value="0.75" class="w-full mt-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" 
                                   oninput="document.getElementById('bInput').value = this.value">
                        </div>
                    </div>
                </div>

                <!-- Documents Input -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-semibold text-gray-700">Dokumen (Korpus)</label>
                        <button onclick="addDocument()" class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded hover:bg-green-200 font-medium transition flex items-center gap-1">
                            <span>+ Tambah Doc</span>
                        </button>
                    </div>
                    
                    <div id="documentList" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                        <!-- Doc inputs will be injected here -->
                    </div>
                </div>

                <!-- Calculate Button -->
                <button onclick="calculate()" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition transform active:scale-95 flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
                    Hitung Relevansi
                </button>

            </div>

            <!-- Right Column: Results & Chart (2/3 width on large screens) -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Chart Container (Stabilized) -->
                <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
                    <h3 class="text-center text-sm font-semibold text-gray-500 mb-2">Visualisasi Skor Relevansi</h3>
                    <!-- Class .chart-container memastikan tinggi tetap -->
                    <div class="chart-container">
                        <canvas id="resultsChart"></canvas>
                    </div>
                </div>

                <!-- Results Table -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <h3 class="text-sm font-bold text-gray-700 mb-3">Tabel Hasil Perhitungan</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                                <tr>
                                    <th class="px-3 py-2 rounded-l-lg">Doc ID</th>
                                    <th class="px-3 py-2 text-blue-700">BM25 Score</th>
                                    <th class="px-3 py-2 text-purple-700">Cosine Sim</th>
                                    <th class="px-3 py-2 text-gray-500 rounded-r-lg">Panjang Doc</th>
                                </tr>
                            </thead>
                            <tbody id="resultsTableBody">
                                <tr>
                                    <td colspan="4" class="px-3 py-4 text-center text-gray-500 italic">
                                        Klik "Hitung" untuk melihat hasil...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Detailed Analysis Box -->
                <div id="analysisBox" class="bg-green-50 p-5 rounded-lg border border-green-100 hidden">
                    <h3 class="text-sm font-bold text-green-800 mb-2 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                        Analisis Logika
                    </h3>
                    <div id="analysisContent" class="text-sm text-green-900 space-y-2">
                        <!-- Dynamic analysis will appear here -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- DATA AWAL ---
        let documents = [
            { id: 1, text: "kucing suka makan ikan segar" },
            { id: 2, text: "anjing suka makan daging" },
            { id: 3, text: "kucing dan anjing adalah hewan peliharaan" }
        ];

        let chartInstance = null;

        // --- FUNGSI HELPER ---

        function tokenize(text) {
            return text
                .toLowerCase()
                .replace(/[^\w\s]/g, '') 
                .trim()
                .split(/\s+/)
                .filter(word => word.length > 0);
        }

        // --- UI RENDERING ---

        function renderDocuments() {
            const list = document.getElementById('documentList');
            list.innerHTML = '';
            documents.forEach((doc) => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2';
                div.innerHTML = `
                    <span class="text-xs font-bold text-gray-500 w-6">#${doc.id}</span>
                    <input type="text" value="${doc.text}" 
                           onchange="updateDocument(${doc.id}, this.value)"
                           class="flex-1 text-sm p-2 border border-gray-300 rounded focus:border-blue-500 outline-none" 
                           placeholder="Isi kalimat dokumen...">
                    <button onclick="removeDocument(${doc.id})" 
                            class="text-red-400 hover:text-red-600 p-1 rounded hover:bg-red-50 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        // --- MANAJEMEN STATE ---

        function addDocument() {
            const newId = documents.length > 0 ? Math.max(...documents.map(d => d.id)) + 1 : 1;
            documents.push({ id: newId, text: "" });
            renderDocuments();
        }

        function removeDocument(id) {
            if(documents.length <= 1) {
                alert("Minimal harus ada 1 dokumen!");
                return;
            }
            documents = documents.filter(d => d.id !== id);
            renderDocuments();
        }

        function updateDocument(id, text) {
            const doc = documents.find(d => d.id === id);
            if (doc) doc.text = text;
        }

        // --- LOGIKA UTAMA ---

        function calculate() {
            const queryText = document.getElementById('queryInput').value;
            const k1 = parseFloat(document.getElementById('k1Input').value);
            const b = parseFloat(document.getElementById('bInput').value);

            if (!queryText.trim()) {
                alert("Mohon isi query terlebih dahulu.");
                return;
            }

            const queryTokens = tokenize(queryText);
            const tokenizedDocs = documents.map(doc => ({
                id: doc.id,
                originalText: doc.text,
                tokens: tokenize(doc.text)
            }));

            // 1. Hitung AvgDocLength
            const totalLength = tokenizedDocs.reduce((sum, doc) => sum + doc.tokens.length, 0);
            const avgdl = totalLength / tokenizedDocs.length;
            const N = tokenizedDocs.length;

            // 2. Hitung BM25
            const bm25Results = tokenizedDocs.map(doc => {
                let score = 0;
                let details = []; // Untuk penjelasan
                const docLen = doc.tokens.length;

                queryTokens.forEach(term => {
                    const f_td = doc.tokens.filter(t => t === term).length;
                    const n_q = tokenizedDocs.filter(d => d.tokens.includes(term)).length;
                    const idf = Math.log( ((N - n_q + 0.5) / (n_q + 0.5)) + 1 );
                    
                    const numerator = f_td * (k1 + 1);
                    const denominator = f_td + k1 * (1 - b + b * (docLen / avgdl));
                    const termScore = idf * (numerator / denominator);

                    score += termScore;
                    
                    if(termScore > 0) {
                        details.push({term, f_td, termScore});
                    }
                });

                return { 
                    id: doc.id, 
                    score: Math.max(0, score),
                    docLen: docLen,
                    details: details 
                };
            });

            // 3. Hitung TF-IDF Cosine
            const allTokens = new Set([...queryTokens]);
            tokenizedDocs.forEach(d => d.tokens.forEach(t => allTokens.add(t)));
            const vocabulary = Array.from(allTokens);

            function getTfIdfVector(targetTokens, allDocs) {
                return vocabulary.map(term => {
                    const rawCount = targetTokens.filter(t => t === term).length;
                    const tf = rawCount > 0 ? (1 + Math.log10(rawCount)) : 0;
                    const df = allDocs.filter(d => d.tokens.includes(term)).length;
                    const idf = df > 0 ? Math.log10(allDocs.length / df) : 0;
                    return tf * idf;
                });
            }

            const queryVector = getTfIdfVector(queryTokens, tokenizedDocs);
            const cosineResults = tokenizedDocs.map(doc => {
                const docVector = getTfIdfVector(doc.tokens, tokenizedDocs);
                let dotProduct = 0, magQuery = 0, magDoc = 0;
                for (let i = 0; i < vocabulary.length; i++) {
                    dotProduct += queryVector[i] * docVector[i];
                    magQuery += queryVector[i] ** 2;
                    magDoc += docVector[i] ** 2;
                }
                magQuery = Math.sqrt(magQuery);
                magDoc = Math.sqrt(magDoc);
                let similarity = (magQuery > 0 && magDoc > 0) ? dotProduct / (magQuery * magDoc) : 0;
                return { id: doc.id, score: similarity };
            });

            updateUI(bm25Results, cosineResults, avgdl);
        }

        function updateUI(bm25, cosine, avgdl) {
            // Update Table
            const tbody = document.getElementById('resultsTableBody');
            tbody.innerHTML = '';
            bm25.forEach((res) => {
                const cosRes = cosine.find(c => c.id === res.id);
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50 transition">
                        <td class="px-3 py-2 font-medium">Doc ${res.id}</td>
                        <td class="px-3 py-2 text-blue-600 font-bold">${res.score.toFixed(4)}</td>
                        <td class="px-3 py-2 text-purple-600 font-bold">${cosRes ? cosRes.score.toFixed(4) : '0.0000'}</td>
                        <td class="px-3 py-2 text-gray-500">${res.docLen} kata</td>
                    </tr>
                `;
            });

            // Update Chart
            const ctx = document.getElementById('resultsChart').getContext('2d');
            const labels = bm25.map(r => `Doc ${r.id}`);
            
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'BM25',
                            data: bm25.map(r => r.score),
                            backgroundColor: 'rgba(37, 99, 235, 0.7)',
                            borderColor: 'rgba(37, 99, 235, 1)',
                            borderWidth: 1,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Cosine Sim (0-1)',
                            data: cosine.map(c => c.score),
                            backgroundColor: 'rgba(147, 51, 234, 0.7)',
                            borderColor: 'rgba(147, 51, 234, 1)',
                            borderWidth: 1,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, // Wajib false agar mengikuti container
                    scales: {
                        y: {
                            beginAtZero: true,
                            position: 'left',
                            title: { display: true, text: 'Score BM25' }
                        },
                        y1: {
                            beginAtZero: true,
                            position: 'right',
                            max: 1.0,
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: 'Similarity' }
                        }
                    }
                }
            });

            // Update Logic Analysis
            const winner = bm25.reduce((prev, current) => (prev.score > current.score) ? prev : current);
            const analysisDiv = document.getElementById('analysisContent');
            const box = document.getElementById('analysisBox');
            
            if (winner.score > 0) {
                box.classList.remove('hidden');
                
                let termsHtml = winner.details.map(d => 
                    `<li>Kata <b>"${d.term}"</b> muncul ${d.f_td} kali (kontribusi skor: ${d.termScore.toFixed(2)})</li>`
                ).join('');

                analysisDiv.innerHTML = `
                    <p>🏆 <b>Dokumen ${winner.id} paling relevan</b> dengan skor BM25: <b>${winner.score.toFixed(4)}</b>.</p>
                    <ul class="list-disc list-inside mt-2 ml-2 text-gray-700">
                        ${termsHtml}
                    </ul>
                    <p class="mt-2 text-xs italic">
                        *Panjang dokumen ini adalah ${winner.docLen} kata (Rata-rata korpus: ${avgdl.toFixed(1)}).
                        ${winner.docLen < avgdl ? "Karena lebih pendek dari rata-rata, dokumen ini mendapat 'boost' positif." : "Karena lebih panjang dari rata-rata, skornya sedikit dinormalisasi (penalti panjang)."}
                    </p>
                `;
            } else {
                box.classList.remove('hidden');
                analysisDiv.innerHTML = `<p class="text-red-600">Tidak ada dokumen yang relevan dengan query (Skor 0).</p>`;
            }
        }

        renderDocuments();
        window.onload = function() { setTimeout(calculate, 500); }
    </script>
</body>
</html>
